name: Code Quality & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Перевірка форматування
  prettier:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run prettier:check

  # Job 2: Запуск тестів Playwright
  playwright-tests:
    name: Playwright Tests
    needs: prettier # Тести почнуться тільки якщо Prettier пройшов успішно
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always() # Звіт завантажиться навіть якщо тести впали
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
